name: eval-gate
on: [push, pull_request]
jobs:
  eval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vox
          POSTGRES_PASSWORD: vox123
          POSTGRES_DB: voxserve
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql+psycopg://vox:vox123@localhost:5432/voxserve
      REDIS_URL: redis://localhost:6379
      MCP_API_KEY: vox-secret-123
      EMBED_PROVIDER: fastembed
      EMBED_MODEL: BAAI/bge-small-en-v1.5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-
      - run: pip install -r requirements.txt
      # Import smoke: same import chain the server boots with (catches dep drift early)
      - run: python -c "import backend.main; print('import-ok')"
      - run: python -m backend.ingest
      # Real gate: eval50 exits non-zero when tool or faith < 0.75
      - run: python -m backend.eval50
