name: eval-gate
on: [push, pull_request]
jobs:
  eval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vox
          POSTGRES_PASSWORD: vox123
          POSTGRES_DB: voxserve
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql+psycopg://vox:vox123@localhost:5432/voxserve
      REDIS_URL: redis://localhost:6379
      MCP_API_KEY: vox-secret-123
      EMBED_PROVIDER: cohere
      EMBED_MODEL: embed-english-light-v3.0
      RERANK_PROVIDER: rrf
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m backend.ingest
      - run: python -m backend.eval50