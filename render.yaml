services:
  - type: web
    name: voxserve-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: voxserve-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: voxserve-cache
          property: connectionString
      - key: EMBED_PROVIDER
        value: fastembed
      - key: EMBED_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: RERANK_PROVIDER
        value: rrf
      - key: MCP_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_HOST
        value: https://us.cloud.langfuse.com
  - type: keyvalue
    name: voxserve-cache
    plan: free

databases:
  - name: voxserve-db
    plan: free
    postgresMajorVersion: 16